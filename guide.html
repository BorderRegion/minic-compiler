nd(Instruction(UNARY[q.op], \"\", q.token))\n            code.append(Instruction(\"STORE\", q.result, q.token))\n    return code","def execute(code):\n    labels = {}\n    for index, instruction in enumerate(code):\n        if instruction.op == \"LABEL\":\n            labels[instruction.argument] = index + 1\n\n    stack = []\n    memory = {}\n    pc = 0\n    while pc \u003c len(code):\n        instruction = code[pc]\n        op = instruction.op\n        arg = instruction.argument\n        pc += 1\n        if op == \"PUSH\":\n            if arg in (\"true\", \"false\"):\n                stack.append(arg == \"true\")\n            else:\n                stack.append(int(arg))\n        elif op == \"CLEAR\":\n            memory.pop(arg, None)\n        elif op == \"LOAD\":\n            if arg not in memory:\n                name = arg.split(\"@\")[0]\n                raise MiniCError(\"运行\", instruction.token, f\"变量 {name} 尚未初始化\")\n            stack.append(memory[arg])\n        elif op == \"STORE\":\n            memory[arg] = stack.pop()\n        elif op in OPERATIONS or op == \"DIV\":\n            # 计算 7 - 2 时先压 7 再压 2，因此先弹出的 2 是右操作数。\n            right = stack.pop()\n            left = stack.pop()\n            if op == \"DIV\":\n                stack.append(divide(left, right, instruction.token))\n            else:\n                value = OPERATIONS[op](left, right)\n                if abs(value) >= INTEGER_BOUND:\n                    raise MiniCError(\"运行\", instruction.token, f\"整数运算结果超过 {MAX_INTEGER_DIGITS} 位\")\n                stack.append(value)\n        elif op in UNARY:\n            stack.append(UNARY[op](stack.pop()))\n        elif op == \"JTRUE\":\n            if stack.pop():\n                pc = labels[arg]\n        elif op == \"JMP\":\n            pc = labels[arg]\n        elif op != \"LABEL\":\n            raise ValueError(f\"未知目标指令 {op}\")\n    return memory","def check_assignment(self, node, symbol):\n    actual = self.expression_type(node.children[0])\n    if actual != symbol.type_name:\n        raise MiniCError(\"语义\", node.token, f\"{symbol.name} 类型为 {symbol.type_name}，赋值类型为 {actual}\")"]}</script>
<script>
"use strict";
const data = JSON.parse(document.getElementById("dataset").textContent);
const chapters = [
  {id:"start", nav:"先跑一遍", topic:"全程预览", title:"四行代码，怎样跑起来？", lead:"先读这段小程序。x 从 0 出发，每绕一圈就加 1。你能猜到它停在哪里吗？接下来我们一路跟着这个 x，看一段文字怎样变成机器能够执行的动作。", lab:"先预测，再看编译结果", why:"先分清两件事", text:"编译器负责翻译，虚拟机负责执行。前五个模块依次产出单词、树、符号表、三地址码和目标指令。直到虚拟机读到 STORE，程序运行时的变量值才被写入存储区。", file:"minic.py", func:"stage_reports", q:"如果只想查看循环的结构，读到哪里就够了？", opts:["Token 序列","抽象语法树","执行结果"], correct:1, reason:"语法树已经把条件和循环体分成两个子节点。"},
  {id:"tokens", nav:"词法分析", topic:"从字符到单词", title:"编译器怎样读出一个词？", lead:"源码是一串字符。扫描器从左到右，把相邻字符拼成可以交给下一阶段的单元，叫作 Token。点击不同的 x，看看它们的类别和位置。", lab:"点一个 Token，回到源码找它", why:"为什么要记行和列？", text:"同一个变量名可以出现许多次。Token 保存类别、原文、行和列，后续阶段才能指出究竟是哪一次使用出了问题。扫描器遇到 <= 时会先匹配两个字符，空格和行注释会被跳过，末尾另加 EOF 表示输入结束。", file:"compiler/lexer.py", func:"scan", q:"扫描 x <= 3 时，<= 会产生几个 Token？", opts:["一个","两个"], correct:0, reason:"扫描器先匹配双字符运算符，<= 整体是一个 OP。"},
  {id:"ast", nav:"语法分析", topic:"从单词到结构", title:"乘法为什么先算？", lead:"Token 的顺序告诉我们谁在前面。语法分析还要回答谁和谁组成一组。切换括号，看看哪一个运算成了树的根。", lab:"换一对括号，看树怎么变", why:"沿着解析函数读优先级", text:"这里使用递归下降。读加减时，addition 先让 product 读完一段乘除，再把两边挂到加减节点下面。括号让解析器在括号内重新读一个完整表达式。回到 while，条件表达式和循环体也各自成为子树。", file:"compiler/parser.py", func:"Parser.addition", q:"在 (2 + 3) * 4 中，表达式子树的根是什么？", opts:["Binary +","Binary *","Literal 4"], correct:1, reason:"括号里的加法是左子树，最外层乘法把它和 4 连起来。"},
  {id:"symbols", nav:"语义分析", topic:"从名字到存储位置", title:"两个 x 是同一个变量吗？", lead:"语法树已经搭好了。接下来要核对每个名字在哪里声明、是什么类型。切换到同名变量的例子，观察两个 x 最终各自绑定到哪里。", lab:"把声明与符号表对起来", why:"符号表怎样帮助类型检查？", text:"进入语句块就建立一层作用域，查名字时从内向外寻找。符号表记录名称、类型、作用域和唯一存储名。知道 x 是 int 后，语义分析器就能推出 x < 3 的结果是 bool，可以用作 while 的条件。", file:"compiler/semantic.py", func:"Analyzer.resolve", q:"内层有 int x = 9，执行内层的 x = x + 1 后，外层 x 是多少？", opts:["3","9","10"], correct:0, reason:"赋值命中内层的 x@1。外层 x@0 仍然存着 3。"},
  {id:"tac", nav:"中间代码", topic:"从树到控制流", title:"循环的那一圈，藏在哪里？", lead:"沿着树可以看懂结构，机器却要知道下一步去哪里。三地址码（TAC）把每次计算、赋值和跳转排成一列。沿着条件为真和为假的两条路，各走一次。", lab:"追踪条件跳转", why:"为什么回到判断之前？", text:"Label 给位置起名字，Cjmp 根据真假选择目的地，Jmp 直接跳转。循环体会修改 x，回到 L1 才会用新值重新计算条件。if-else 也使用真假目标，两条分支在末尾汇合。短路逻辑则把整个右操作数放在只有必要时才会进入的分支里。", file:"compiler/ir.py", func:"Generator.while_statement", q:"如果循环体末尾直接跳回 L2，会发生什么？", opts:["少循环一次","一直执行循环体","立即退出"], correct:1, reason:"L2 是循环体入口，跳到这里会绕过条件重算和退出判断。"},
  {id:"target", nav:"目标指令", topic:"从三地址码到栈指令", title:"一条加法，要翻译几步？", lead:"TAC 直接写出左右操作数和结果。栈式机器则先把操作数送上栈，执行运算，再保存结果。选一条 TAC，查看它实际生成的那组指令。", lab:"逐条对照翻译结果", why:"栈顶的左右顺序", text:"LOAD 读取存储位置，PUSH 压入常量，STORE 把栈顶写回。二元运算先弹出右操作数，再弹出左操作数。对 7 - 2 来说，先弹到 2，后弹到 7，结果才是 5。声明处的 CLEAR 用来清除上次进入该声明时的旧值。", file:"compiler/codegen.py", func:"generate_target", q:"执行 PUSH 7、PUSH 2、SUB 后，栈顶是什么？", opts:["-5","5","2"], correct:1, reason:"第二个入栈的 2 是右操作数，所以计算 7 - 2。"},
  {id:"vm", nav:"虚拟机", topic:"逐条执行", title:"亲手走完最后一圈", lead:"程序计数器 PC 指向下一条指令。现在每前进一步，就执行一条真实记录中的目标指令。先看比较结果去哪儿了，再跳到最后一次比较，看循环怎样停下。", lab:"虚拟机执行回放", why:"什么时候可以读出答案？", text:"每一步都从 PC 取指。普通指令继续往下走，跳转会改写 PC。虚拟机先把标号映射为指令位置；跳转直接到标号之后。PC 越过最后一条指令时，读取顶层变量的最终值，这个例子得到 x = 3。", file:"compiler/vm.py", func:"execute", q:"x 从 0 加到 3 的过程中，x < 3 一共判断几次？", opts:["3 次","4 次","5 次"], correct:1, reason:"x 为 0、1、2 时进入循环，x 为 3 时还要再判断一次才能退出。"},
  {id:"errors", nav:"错误与复习", topic:"独立复现", title:"程序停在哪一站？", lead:"调试时，先问上一阶段留下了什么，再读报错的行和列。选一个错误，把源码、诊断和本次产生的文件对起来。", lab:"观察四种失败现场", why:"回到自己的终端", text:"运行 python3 minic.py examples/loop.mc，沿 output/loop 里的六份文件讲一遍。再运行 arithmetic.mc 检查括号优先级，运行 branch.mc 解释为什么右侧除零可以被跳过。最后用 python3 -m unittest discover -s tests -v 检查源码修改有没有破坏这些行为。", file:"compiler/semantic.py", func:"Analyzer.check_assignment", q:"int x; int y = x; 会在哪一步被拦住？", opts:["语法分析","语义分析","虚拟机执行"], correct:2, reason:"x 已经声明且类型相符。虚拟机真正读取它的存储位置时，才发现尚未初始化。"}
];
const byId = id => document.getElementById(id);
const escapeHTML = value => String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const lab = byId("lab");
function board(label, code) {
  return '<div class="board"><span class="caption">'+escapeHTML(label)+'</span><pre>'+escapeHTML(code)+'</pre></div>';
}
function split(left, right) { return '<div class="split">'+left+right+'</div>'; }
function button(label, action) {
  const node = document.createElement("button");
  node.type = "button";
  node.className = "btn";
  node.textContent = label;
  node.onclick = action;
  return node;
}
// 选项只更新实验区，保留当前按钮的键盘焦点。
function choices(labels, initial, draw) {
  lab.innerHTML = '<div class="controls" id="choices"></div><div id="experiment"></div>';
  function select(index) {
    [...byId("choices").children].forEach((b,i) => b.setAttribute("aria-pressed", i===index));
    draw(index, byId("experiment"));
  }
  labels.forEach((label,i) => byId("choices").append(button(label, () => select(i))));
  select(initial);
}
function intro() {
  const ids = ["loop","arithmetic","branch"];
  const prompts = ["循环结束时，x 会停在哪里？","加上一对括号，a 和 b 还相等吗？","最后两行的除法会执行吗？"];
  choices(["循环","算术","分支"],0,(i,pane) => {
    const sample = data[ids[i]];
    pane.innerHTML = '<div class="welcome">'+split(board("examples/"+ids[i]+".mc",sample.src),
      '<div><p class="caption">读完源码，先猜结果</p><h3>'+prompts[i]+'</h3><div class="big" id="predicted">?</div><button class="btn primary" id="reveal">查看执行结果</button></div>')+'</div>';
    byId("reveal").onclick = () => {
      byId("predicted").className = "result";
      byId("predicted").textContent = sample.out.result;
      byId("reveal").disabled = true;
    };
    const path = document.createElement("div");
    path.className="path";
    for (const c of chapters.slice(1,7)) {
      const link=document.createElement("a"); link.href="#"+c.id; link.textContent=c.nav; path.append(link);
    }
    pane.append(path);
  });
}
function tokens() {
  lab.innerHTML = split('<div class="board"><span class="caption">examples/loop.mc</span><pre id="source"></pre></div>',
    '<div><span class="caption">按源码顺序排列的 Token</span><div id="tokenlist" class="tokens"></div><p id="position" class="note" role="status"></p></div>');
  const rows = data.loop.src.split("\n");
  const labels = {IDENT:"标识符",OP:"运算符",INTEGER:"整数常量",DELIMITER:"界符",KEYWORD:"关键字"};
  function select(i) {
    const t=data.tokens[i];
    byId("source").innerHTML=rows.map((row,n) => {
      if(n+1!==t.line) return escapeHTML(row);
      const at=t.column-1;
      return escapeHTML(row.slice(0,at))+"<mark>"+escapeHTML(t.text)+"</mark>"+escapeHTML(row.slice(at+t.text.length));
    }).join("\n");
    byId("position").textContent=labels[t.kind]+" · "+t.kind+" ｜ 第 "+t.line+" 行，第 "+t.column+" 列";
    [...byId("tokenlist").children].forEach((b,n)=>b.setAttribute("aria-pressed",n===i));
  }
  data.tokens.forEach((t,i)=>{
    const b=button(t.text,()=>select(i));
    b.setAttribute("aria-label",t.text+"，第 "+t.line+" 行第 "+t.column+" 列"); byId("tokenlist").append(b);
  });
  select(7);
}
function ast() {
  choices(["2 + 3 × 4","(2 + 3) × 4","回到 while"],0,(i,pane)=>{
    const sample=data[["priority","brackets","loop"][i]];
    pane.innerHTML=split(board("MiniC 源码",sample.src),board("语法树 · 缩进表示子节点",sample.out.ast))+
      '<p class="note">'+["Binary + 接住左边的 2 和右边整棵乘法子树，结果为 14。","根变成 Binary *，左边整棵加法子树先得到 5，最终结果为 20。","找到 While 的两个直接子节点：Binary &lt; 是条件，Block 是每轮执行的循环体。"][i]+'</p>';
  });
}
function symbols() {
  choices(["顶层的 x","块内再声明 x","试着把 int 赋给 bool"],0,(i,pane)=>{
    const sample=data[["loop","shadow","semantic"][i]];
    pane.innerHTML=split(board("MiniC 源码",sample.src),board("symbols.txt",sample.out.symbols))+
      '<p class="note">'+["x@0 中的 0 是作用域编号。循环体对 x 的读写都回到这个位置。","查找从内层开始，所以块内修改 x@1。运行结束时，顶层 x 的值仍为 3。","赋值右侧 x 的类型是 int，左侧 ok 需要 bool。编译在此停止，符号表记录了出错前收集到的声明。"][i]+'</p>';
  });
}
function tac() {
  choices(["条件为真","条件为假","逻辑短路"],0,(i,pane)=>{
    const sample=i===2?data.short:data.loop;
    const dest=["L2","L3","L2"][i];
    const lines=sample.out.tac.split("\n").map(s=>{
      const line=escapeHTML(s);
      return s==="Label "+dest ? "<mark>"+line+"</mark>" : line;
    });
    pane.innerHTML=split(board("MiniC 源码",sample.src),'<div class="board"><span class="caption">tac.txt · 本次跳转目的地</span><pre>'+lines.join("\n")+'</pre></div>')+
      '<p class="note">'+["假设 x 为 2。%t1 得到 true，Cjmp 选择 L2。执行加一和赋值，再从 Jmp L1 回到条件。","假设 x 为 3。%t1 得到 false，Cjmp 直接转到 L3，循环结束。","左侧 false 已经决定了 && 的结果，Cjmp 选择 L2。除法虽然出现在 TAC 里，这次执行却跳过了它。"][i]+'</p>';
  });
}
function target() {
  lab.innerHTML=split('<div><label class="caption">选择一条三地址码</label><div class="rows" id="quads"></div></div>',
    '<div><div class="board"><span class="caption">对应的目标指令</span><pre id="assembly"></pre></div><p class="note" id="asmNote"></p></div>');
  const notes=["CLEAR 清除旧值。以后读取前必须先写入。","常量 0 入栈，再写入 x@0。","标号给条件重算的位置命名。","读取 x，压入 3，比较，再把布尔结果写入临时变量。","读取布尔结果。为真执行 JTRUE 的跳转，为假继续执行 JMP。","这个标号指出循环体入口。","读取 x，压入 1，做加法，再保存临时结果。","读取刚算出的临时值，覆盖变量 x。","直接跳回判断条件处。","循环从这里退出。"];
  function select(i){
    byId("assembly").textContent=data.translations[i][1].join("\n");
    byId("asmNote").textContent=notes[i];
    [...byId("quads").children].forEach((b,n)=>b.setAttribute("aria-pressed",i===n));
  }
  data.translations.forEach(([q],i)=>byId("quads").append(button(q,()=>select(i))));
  select(6);
}
function vm() {
  const frames=data.frames, last=frames.length-1, code=data.loop.out.target.split("\n");
  lab.innerHTML='<div class="controls" id="vmControls"></div>'+split(
    '<div class="board"><span class="caption">目标指令 · PC 从 0 开始</span><pre id="listing" style="max-height:240px"></pre></div>',
    '<div><span id="stepStatus" class="status" role="status"></span><div class="stats"><div class="stat">PC<br><strong id="pc"></strong></div><div class="stat">变量 x<br><strong id="x"></strong></div></div><p class="caption">操作数栈 · 右端是栈顶</p><pre id="stack" class="result"></pre><p class="caption">临时变量</p><pre id="temps" class="result"></pre></div>')+
    '<label for="timeline" class="caption">拖动回放进度</label><input id="timeline" class="track" type="range" min="0" value="0" max="'+last+'">';
  let index=0;
  function move(to){
    index=Math.max(0,Math.min(to,last));
    const [pc,stack,memory]=frames[index];
    byId("timeline").value=index;
    byId("listing").innerHTML=code.map((op,i)=>{
      const row=String(i).padStart(2,"0")+"   "+escapeHTML(op);
      return i===pc?"<mark>"+row+"</mark>":row;
    }).join("\n");
    const listing=byId("listing"), mark=listing.querySelector("mark");
    if(mark) listing.scrollTop+=mark.getBoundingClientRect().top-listing.getBoundingClientRect().top-listing.clientHeight/2;
    else listing.scrollTop=listing.scrollHeight;
    byId("stepStatus").textContent=(index===last?"已结束":"下一条待执行")+" · "+index+" / "+last+" 步";
    byId("pc").textContent=pc;
    byId("x").textContent=memory["x@0"]??"未赋值";
    byId("stack").textContent="["+stack.join(", ")+"]";
    byId("temps").textContent=Object.entries(memory).filter(([k])=>k.startsWith("%")).map(([k,v])=>k+" = "+v).join("\n")||"尚未写入";
    prev.disabled=index===0; next.disabled=index===last;
  }
  const prev=button("上一步",()=>move(index-1)), next=button("执行一步",()=>move(index+1)); next.classList.add("primary");
  const finalCompare=frames.findIndex(([pc,,memory])=>code[pc]==="LT" && memory["x@0"]===3);
  byId("vmControls").append(prev,next,button("最后一次比较",()=>move(finalCompare)),button("看终态",()=>move(last)));
  byId("timeline").oninput=e=>move(Number(e.target.value));
  move(0);
}
function errors() {
  choices(["非法字符","缺少分号","类型不匹配","未初始化"],0,(i,pane)=>{
    const sample=data[["lexical","syntax","semantic","runtime"][i]];
    const produced=Object.keys(sample.out).map(k=>k+".txt").join("、")||"尚无完整阶段输出";
    pane.innerHTML=split(board("出错的源程序",sample.src),board("实际诊断",sample.error))+
      '<p class="note">本次输出：'+escapeHTML(produced)+'</p><p>'+["扫描器遇到 @ 时就停下了。把它换成整数字面量，例如 1。","解析器在第二行看到 x 时还在等待分号。把分号补在第一行末尾。","符号表里能查到 x 和 ok。把右侧改成 x > 0，赋值两边就都是 bool。","所有编译阶段都通过了。给 x 一个初值，LOAD 才能读到它。"][i]+'</p>';
  });
}
const labs=[intro,tokens,ast,symbols,tac,target,vm,errors];
const nav=byId("nav");
chapters.forEach((c,i)=>{
  const a=document.createElement("a"); a.href="#"+c.id; a.innerHTML='<span>'+String(i+1).padStart(2,"0")+'</span>'+c.nav; nav.append(a);
});
const selectedAnswers=new Map();
function render(focus=false){
  const index=Math.max(0,chapters.findIndex(c=>"#"+c.id===location.hash));
  const c=chapters[index];
  document.title=c.nav+" · MiniC 学习手册";
  chapters.forEach((chapter,i)=>{
    if(i===index) nav.children[i].setAttribute("aria-current","page");
    else nav.children[i].removeAttribute("aria-current");
  });
  byId("counter").textContent=String(index+1).padStart(2,"0")+" / 08";
  for(const [id,value] of Object.entries({topic:c.topic,title:c.title,lead:c.lead,labtitle:c.lab,why:c.why,explain:c.text,
      summary:"对照源码 · "+c.func,snippet:data.snippets[index],question:c.q})) byId(id).textContent=value;
  byId("implementation").open=false;
  byId("filelink").textContent="打开仓库文件 "+c.file;
  byId("filelink").href="https://github.com/BorderRegion/minic-compiler/blob/main/"+c.file;
  labs[index]();
  const answers=byId("answers"),feedback=byId("feedback"); answers.replaceChildren(); feedback.textContent="";
  function respond(i){
    selectedAnswers.set(index,i);
    [...answers.children].forEach((b,n)=>b.setAttribute("aria-pressed",n===i));
    feedback.textContent=(i===c.correct?"答对了。":"再想想。")+c.reason;
  }
  c.opts.forEach((opt,i)=>answers.append(button(opt,()=>respond(i))));
  if(selectedAnswers.has(index)) respond(selectedAnswers.get(index));
  const footer=byId("footnav"); footer.replaceChildren();
  if(index){const a=document.createElement("a");a.href="#"+chapters[index-1].id;a.textContent="← "+chapters[index-1].nav;footer.append(a);}
  else footer.append(document.createElement("span"));
  const next=document.createElement("a"); next.className="primary";
  next.href="#"+chapters[(index+1)%chapters.length].id;
  next.textContent=index===chapters.length-1?"回到开篇 ↑":"下一节 · "+chapters[index+1].nav+" →";footer.append(next);
  if(focus){byId("title").focus({preventScroll:true});window.scrollTo(0,0);}
}
window.addEventListener("hashchange",()=>{if(location.hash!=="#title")render(true);});
render();
</script></body></html>
